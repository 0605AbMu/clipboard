name: Cross-Platform Release (macOS, Linux, Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [osx-arm64, osx-x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build self-contained macOS DMG
        run: |
          chmod +x ./build-dmg.sh
          ./build-dmg.sh ${{ matrix.arch }} ${{ steps.get_version.outputs.version }}

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-macOS-${{ matrix.arch }}
          path: Clipboard-*.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux Package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [linux-x64, linux-arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build self-contained Linux tar.gz
        run: |
          chmod +x ./build-linux.sh
          ./build-linux.sh ${{ matrix.arch }} ${{ steps.get_version.outputs.version }}

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Linux-${{ matrix.arch }}
          path: Clipboard-*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows Zip (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish Self-Contained Windows
        shell: bash
        run: |
          chmod +x ./build-windows.sh
          ./build-windows.sh win-x64 ${{ steps.get_version.outputs.version }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Windows-win-x64
          path: Clipboard-*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/*.dmg
            ./release-assets/*.tar.gz
            ./release-assets/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
